name: Build PACE 0.3 Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build PACE 0.3 app and setup
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install app build dependencies
        run: python -m pip install --upgrade pip pyinstaller customtkinter darkdetect

      - name: Build PACE 0.3 executable
        shell: pwsh
        env:
          PACE_CODESIGN_PFX_BASE64: ${{ secrets.PACE_CODESIGN_PFX_BASE64 }}
          PACE_CODESIGN_PASSWORD: ${{ secrets.PACE_CODESIGN_PASSWORD }}
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name PACE03 --icon app/assets/pace.ico --collect-all customtkinter --collect-all darkdetect app/pace_app_v03.py
          if (!(Test-Path 'dist/PACE03.exe')) { throw 'PyInstaller did not create dist/PACE03.exe' }
          if ($env:PACE_CODESIGN_PFX_BASE64 -and $env:PACE_CODESIGN_PASSWORD) {
            $pfx = Join-Path $env:RUNNER_TEMP 'pace-codesign.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PACE_CODESIGN_PFX_BASE64))
            $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
            if (!$signtool) { throw 'SignTool was not found on the Windows runner.' }
            & $signtool.FullName sign /f $pfx /p $env:PACE_CODESIGN_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 'dist/PACE03.exe'
            if ($LASTEXITCODE -ne 0) { throw 'Signing PACE03.exe failed.' }
            Remove-Item $pfx -Force
            Write-Host 'PACE03.exe was signed with the configured code-signing certificate.'
          } else {
            Write-Warning 'No code-signing certificate secrets configured; building an unsigned beta.'
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { choco install innosetup --yes --no-progress }
          if (!(Test-Path $iscc)) { throw 'Inno Setup compiler was not found after installation.' }

      - name: Build and optionally sign installer
        shell: pwsh
        env:
          PACE_CODESIGN_PFX_BASE64: ${{ secrets.PACE_CODESIGN_PFX_BASE64 }}
          PACE_CODESIGN_PASSWORD: ${{ secrets.PACE_CODESIGN_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Force -Path releases | Out-Null
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'installer/PACE-Setup-0.3.0-beta.iss'
          if (!(Test-Path 'releases/PACE-Setup-0.3.0-beta.exe')) { throw 'Setup installer was not created.' }
          if ($env:PACE_CODESIGN_PFX_BASE64 -and $env:PACE_CODESIGN_PASSWORD) {
            $pfx = Join-Path $env:RUNNER_TEMP 'pace-codesign.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PACE_CODESIGN_PFX_BASE64))
            $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
            if (!$signtool) { throw 'SignTool was not found on the Windows runner.' }
            & $signtool.FullName sign /f $pfx /p $env:PACE_CODESIGN_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 'releases/PACE-Setup-0.3.0-beta.exe'
            if ($LASTEXITCODE -ne 0) { throw 'Signing the installer failed.' }
            Remove-Item $pfx -Force
            Write-Host 'Installer signed successfully.'
          } else {
            Write-Warning 'No code-signing certificate secrets configured; installer remains unsigned.'
          }
          $hash = (Get-FileHash 'releases/PACE-Setup-0.3.0-beta.exe' -Algorithm SHA256).Hash.ToLower()
          "$hash  PACE-Setup-0.3.0-beta.exe" | Out-File -FilePath 'releases/SHA256SUMS-0.3.0.txt' -Encoding ascii

      - name: Upload PACE 0.3 installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: PACE-Setup-0.3.0-beta-Windows-x64
          path: |
            releases/PACE-Setup-0.3.0-beta.exe
            releases/SHA256SUMS-0.3.0.txt
          if-no-files-found: error
          retention-days: 30

      - name: Create draft PACE 0.3 beta release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.3.0-beta
          name: PACE 0.3 Beta — Windows
          body_path: PACE-0.3.0-BETA-NOTES.md
          draft: true
          prerelease: true
          overwrite_files: true
          files: |
            releases/PACE-Setup-0.3.0-beta.exe
            releases/SHA256SUMS-0.3.0.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
