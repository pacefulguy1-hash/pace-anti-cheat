name: Build Paceful Shield 0.4 Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Paceful Shield 0.4 app and setup
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install app build dependencies
        run: python -m pip install --upgrade pip pyinstaller customtkinter darkdetect watchdog pystray pillow winotify Send2Trash psutil

      - name: Run scanner smoke tests
        run: python -m unittest discover -s tests -v

      - name: Build Paceful Shield executable
        shell: pwsh
        env:
          PACE_CODESIGN_PFX_BASE64: ${{ secrets.PACE_CODESIGN_PFX_BASE64 }}
          PACE_CODESIGN_PASSWORD: ${{ secrets.PACE_CODESIGN_PASSWORD }}
        run: |
          python -m py_compile app/pace_app_v04.py
          pyinstaller --noconfirm --clean --onefile --windowed --name PacefulShield04 --icon app/assets/paceful-shield.ico --add-data "app/assets/paceful-shield.png;assets" --collect-all customtkinter --collect-all darkdetect --collect-all watchdog --collect-all pystray --collect-all winotify --collect-all psutil --hidden-import pystray._win32 app/pace_app_v04.py
          if (!(Test-Path 'dist/PacefulShield04.exe')) { throw 'PyInstaller did not create dist/PacefulShield04.exe' }
          if ($env:PACE_CODESIGN_PFX_BASE64 -and $env:PACE_CODESIGN_PASSWORD) {
            $pfx = Join-Path $env:RUNNER_TEMP 'pace-codesign.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PACE_CODESIGN_PFX_BASE64))
            $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
            if (!$signtool) { throw 'SignTool was not found on the Windows runner.' }
            & $signtool.FullName sign /f $pfx /p $env:PACE_CODESIGN_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 'dist/PacefulShield04.exe'
            if ($LASTEXITCODE -ne 0) { throw 'Signing the application failed.' }
            Remove-Item $pfx -Force
          } else {
            Write-Warning 'No code-signing certificate secrets configured; application will be unsigned.'
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { choco install innosetup --yes --no-progress }
          if (!(Test-Path $iscc)) { throw 'Inno Setup compiler was not found after installation.' }

      - name: Build installer and checksum
        shell: pwsh
        env:
          PACE_CODESIGN_PFX_BASE64: ${{ secrets.PACE_CODESIGN_PFX_BASE64 }}
          PACE_CODESIGN_PASSWORD: ${{ secrets.PACE_CODESIGN_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Force -Path releases | Out-Null
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'installer/Paceful-Shield-Setup-0.4.0-beta.iss'
          if (!(Test-Path 'releases/Paceful-Shield-Setup-0.4.0-beta.exe')) { throw 'Setup installer was not created.' }
          if ($env:PACE_CODESIGN_PFX_BASE64 -and $env:PACE_CODESIGN_PASSWORD) {
            $pfx = Join-Path $env:RUNNER_TEMP 'pace-codesign.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PACE_CODESIGN_PFX_BASE64))
            $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
            if (!$signtool) { throw 'SignTool was not found on the Windows runner.' }
            & $signtool.FullName sign /f $pfx /p $env:PACE_CODESIGN_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 'releases/Paceful-Shield-Setup-0.4.0-beta.exe'
            if ($LASTEXITCODE -ne 0) { throw 'Signing the installer failed.' }
            Remove-Item $pfx -Force
          } else {
            Write-Warning 'No code-signing certificate secrets configured; installer remains unsigned.'
          }
          $hash = (Get-FileHash 'releases/Paceful-Shield-Setup-0.4.0-beta.exe' -Algorithm SHA256).Hash.ToLower()
          "$hash  Paceful-Shield-Setup-0.4.0-beta.exe" | Out-File -FilePath 'releases/SHA256SUMS-0.4.0.txt' -Encoding ascii

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: Paceful-Shield-Setup-0.4.0-beta-Windows-x64
          path: |
            releases/Paceful-Shield-Setup-0.4.0-beta.exe
            releases/SHA256SUMS-0.4.0.txt
          if-no-files-found: error
          retention-days: 30

      - name: Create draft 0.4 Beta release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.4.0-beta
          name: Paceful Shield 0.4 Beta — Windows
          body_path: PACEFUL-SHIELD-0.4.0-BETA-NOTES.md
          draft: true
          prerelease: true
          overwrite_files: true
          files: |
            releases/Paceful-Shield-Setup-0.4.0-beta.exe
            releases/SHA256SUMS-0.4.0.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
